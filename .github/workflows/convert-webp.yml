name: Convert JPG/PNG to WebP

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Bucket alt yolu (ör: elektronik/akilli-saat-ve-bileklik/oppo)"
        required: true
      quality:
        description: "WebP kalite (1-100)"
        required: false
        default: "82"
      update_db:
        description: "products.image_url güncellensin mi?"
        type: boolean
        default: false
      trace:                      # 🔹 YENİ
        description: "İzleme ID (UI/API tarafından atanır)"
        required: true
        default: "manual"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Print inputs
        run: |
          echo "prefix=${{ inputs.prefix }}"
          echo "quality=${{ inputs.quality }}"
          echo "update_db=${{ inputs.update_db }}"
          echo "trace=${{ inputs.trace }}"
          echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund

      - name: Convert & Upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
          BUCKET: ${{ secrets.BUCKET }}
          PRODUCTS_TABLE: ${{ secrets.PRODUCTS_TABLE }}
          IMAGE_COLUMN: ${{ secrets.IMAGE_COLUMN }}
        run: |
          node scripts/convert-webp.mjs \
            --prefix "${{ inputs.prefix }}" \
            --quality "${{ inputs.quality }}" \
            ${{ fromJSON(inputs.update_db) && '--update-db' || '' }}
