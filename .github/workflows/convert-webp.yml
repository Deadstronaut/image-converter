name: Convert JPG/PNG to WebP

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Bucket alt yolu (ör: elektronik/akilli-saat-ve-bileklik/oppo)"
        required: true
      update_db:
        description: "products.image_url güncellensin mi?"
        required: false
        default: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm install @supabase/supabase-js --no-audit --no-fund
      - run: npm install -g @squoosh/cli

      - name: Convert + Upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
          BUCKET: ${{ secrets.BUCKET }}
          PRODUCTS_TABLE: ${{ secrets.PRODUCTS_TABLE }}
          IMAGE_COLUMN: ${{ secrets.IMAGE_COLUMN }}
        run: |
          # 1) Prefix altındaki dosyaları indir
          mkdir -p input
          node scripts/download-prefix.mjs --prefix "${{ github.event.inputs.prefix }}" --out ./input

          # 2) JPG/PNG -> WebP çevir
          for f in ./input/*.{jpg,jpeg,png}; do
            [ -e "$f" ] || continue
            squoosh-cli --webp auto "$f"
          done

          # 3) Supabase’e yükle ve DB güncelle
          node scripts/upload-webp.mjs \
            --prefix "${{ github.event.inputs.prefix }}" \
            ${{ github.event.inputs.update_db == 'true' && '--update-db' || '' }}
