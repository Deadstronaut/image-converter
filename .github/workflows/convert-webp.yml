name: Convert JPG/PNG to WebP

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Bucket alt yolu (ör: elektronik/akilli-saat-ve-bileklik/samsung)"
        required: false
      quality:
        description: "WebP kalite (1-100)"
        required: false
        default: "80"
      update_db:
        description: "products.image_url güncellensin mi?"
        required: false
        default: "true"
        type: choice
        options: [true, false]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache RMBG-2.0 model
        uses: actions/cache@v4
        with:
          path: scripts/models/RMBG-2.0
          key: ${{ runner.os }}-rmbg20-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node deps
        run: npm install --no-audit --no-fund

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2"
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install pillow safetensors einops kornia timm tqdm \
                     scikit-image==0.22.0 opencv-python-headless==4.10.0.84 \
                     scipy prettytable transformers "huggingface-hub>=0.25.0" accelerate

      - name: Convert & Upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
          BUCKET: ${{ secrets.BUCKET }}
          PRODUCTS_TABLE: ${{ secrets.PRODUCTS_TABLE }}
          IMAGE_COLUMN: ${{ secrets.IMAGE_COLUMN }}
        run: |
          node scripts/convert-webp.mjs \
            --prefix "${{ inputs.prefix }}" \
            --quality "${{ inputs.quality }}" \
            --model "rmbg20" \
            ${{ fromJSON(inputs.update_db) && '--update-db' || '' }}
