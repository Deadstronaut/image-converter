name: Convert JPG/PNG to WebP

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Bucket alt yolu (ör: elektronik/akilli-saat-ve-bileklik/samsung)"
        required: false
      quality:
        description: "WebP kalite (1-100)"
        required: false
        default: "82"
      update_db:
        description: "products.image_url güncellensin mi?"
        type: boolean
        default: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node deps
        run: npm install --no-audit --no-fund

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install rembg + deps
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2"
          pip install onnxruntime==1.17.3
          pip install "rembg[cli]==2.0.50"
          pip install scikit-image==0.22.0 pillow==10.4.0 pymatting==1.1.14 tqdm==4.66.4 opencv-python-headless==4.10.0.84 pooch==1.8.2

      - name: Convert & Upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
          BUCKET: ${{ secrets.BUCKET }}
          PRODUCTS_TABLE: ${{ secrets.PRODUCTS_TABLE }}
          IMAGE_COLUMN: ${{ secrets.IMAGE_COLUMN }}
        run: |
          node scripts/convert-webp.mjs \
            --prefix "${{ inputs.prefix }}" \
            --quality "${{ inputs.quality }}" \
            ${{ fromJSON(inputs.update_db) && '--update-db' || '' }}

      - name: Force numpy<2 before refine
        run: |
          pip install --upgrade "numpy<2"
          pip install --force-reinstall onnxruntime==1.17.3

      - name: Run refine_bg.py (opsiyonel)
        run: python scripts/refine_bg.py
