name: Convert JPG/PNG to WebP

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Bucket alt yolu (ör: elektronik/akilli-saat-ve-bileklik/samsung)"
        required: false
      quality:
        description: "WebP kalite (1-100)"
        required: false
        default: "82"
      update_db:
        description: "products.image_url güncellensin mi?"
        required: false
        default: "true"
      fg_threshold:
        description: "Foreground threshold"
        required: false
        default: "220"
      bg_threshold:
        description: "Background threshold"
        required: false
        default: "30"
      erode_size:
        description: "Erode size"
        required: false
        default: "1"
      fill_holes:
        description: "Mask delikleri doldurulsun mu?"
        required: false
        default: "true"
      blur_radius:
        description: "Kenar yumuşatma (Gaussian blur radius)"
        required: false
        default: "0.0"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node deps
        run: npm install --no-audit --no-fund

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps (numpy<2 + onnxruntime 1.16.3)
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2"
          pip install onnxruntime==1.16.3
          pip install "rembg[cli]==2.0.50" \
                      scikit-image==0.22.0 \
                      pillow==10.4.0 \
                      pymatting==1.1.14 \
                      tqdm==4.66.4 \
                      opencv-python-headless==4.10.0.84 \
                      pooch==1.8.2

      - name: Convert & Upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
          BUCKET: ${{ secrets.BUCKET }}
          PRODUCTS_TABLE: ${{ secrets.PRODUCTS_TABLE }}
          IMAGE_COLUMN: ${{ secrets.IMAGE_COLUMN }}
        run: |
          node scripts/convert-webp.mjs \
            --prefix "${{ inputs.prefix }}" \
            --quality "${{ inputs.quality }}" \
            --fg_threshold "${{ inputs.fg_threshold }}" \
            --bg_threshold "${{ inputs.bg_threshold }}" \
            --erode_size "${{ inputs.erode_size }}" \
            --fill_holes "${{ inputs.fill_holes }}" \
            --blur_radius "${{ inputs.blur_radius }}" \
            ${{ fromJSON(inputs.update_db) && '--update-db' || '' }}
