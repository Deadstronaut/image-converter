name: Convert JPG/PNG to WebP

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Bucket alt yolu (or: elektronik/akilli-saat-ve-bileklik/samsung)"
        required: false
      quality:
        description: "WebP kalite (1-100)"
        required: false
        default: "60"
      update_db:
        description: "products.image_url guncellensin mi?"
        required: false
        default: "true"
        type: choice
        options: [true, false]
      model:
        description: "Kullanilacak BiRefNet modeli"
        required: false
        default: "dynamic"
        type: choice
        options: [hr, dynamic, general, rmbg20]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare BiRefNet weights
        shell: bash
        env:
          SELECTED_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          git lfs install
          case "$SELECTED_MODEL" in
            dynamic)
              folder="BiRefNet_dynamic"
              repo_url="https://huggingface.co/ZhengPeng7/BiRefNet_dynamic"
              ;;
            hr)
              folder="BiRefNet_HR"
              repo_url="https://huggingface.co/ZhengPeng7/BiRefNet_HR"
              ;;
            general)
              folder="BiRefNet_general"
              repo_url="https://huggingface.co/ZhengPeng7/BiRefNet_general"
              ;;
            rmbg20)
              folder="RMBG-2.0"
              repo_url="https://huggingface.co/skytnt/rmbg-2.0"
              ;;
            *)
              echo "Unsupported model: $SELECTED_MODEL" >&2
              exit 1
              ;;
          esac
          dest="scripts/models/${folder}"
          mkdir -p scripts/models
          rm -rf "$dest"
          git clone --depth 1 "$repo_url" "$dest"
          rm -rf "$dest/.git"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node deps
        run: npm install --no-audit --no-fund

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2"
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install \
            pillow \
            safetensors \
            einops \
            kornia \
            timm \
            tqdm \
            scikit-image==0.22.0 \
            opencv-python-headless==4.10.0.84 \
            scipy \
            prettytable \
            transformers \
            "huggingface-hub>=0.25.0" \
            accelerate

      - name: Convert & Upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
          BUCKET: ${{ secrets.BUCKET }}
          PRODUCTS_TABLE: ${{ secrets.PRODUCTS_TABLE }}
          IMAGE_COLUMN: ${{ secrets.IMAGE_COLUMN }}
        run: |
          node scripts/convert-webp.mjs \
            --prefix "${{ inputs.prefix }}" \
            --quality "${{ inputs.quality }}" \
            --model "${{ inputs.model }}" \
            ${{ fromJSON(inputs.update_db) && '--update-db' || '' }}


