name: Convert JPG/PNG to WebP

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Bucket alt yolu (ör: elektronik/akilli-saat-ve-bileklik/oppo)"
        required: true
      quality:
        description: "WebP kalite (1-100)"
        required: false
        default: "82"
      update_db:
        description: "products.image_url güncellensin mi?"
        required: false
        default: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: convert-webp
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm install @squoosh/lib @supabase/supabase-js --no-audit --no-fund
      - name: Convert
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
          BUCKET: ${{ secrets.BUCKET }}
          PRODUCTS_TABLE: ${{ secrets.PRODUCTS_TABLE }}
          IMAGE_COLUMN: ${{ secrets.IMAGE_COLUMN }}
          NODE_OPTIONS: "--experimental-wasm-modules --no-warnings"
        run: |
          node scripts/convert-webp.mjs \
            --prefix "${{ github.event.inputs.prefix }}" \
            --quality "${{ github.event.inputs.quality }}" \
            ${{ github.event.inputs.update_db == 'true' && '--update-db' || '' }}
