name: Convert JPG/PNG to WebP

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Bucket alt yolu (ör: elektronik/akilli-saat-ve-bileklik/samsung)"
        required: false
      quality:
        description: "WebP kalite (1-100)"
        required: false
        default: "60"
      update_db:
        description: "products.image_url güncellensin mi?"
        required: false
        default: "true"
        type: choice
        options: [true, false]
      model:
        description: "Kullanılacak model"
        required: false
        default: "rmbg20"
        type: choice
        options: [hr, dynamic, rmbg20]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node deps
        run: npm install --no-audit --no-fund

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2"
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install \
            pillow \
            safetensors \
            einops \
            kornia \
            timm \
            tqdm \
            scikit-image==0.22.0 \
            opencv-python-headless==4.10.0.84 \
            scipy \
            prettytable \
            transformers \
            "huggingface-hub>=0.25.0" \
            accelerate

      - name: Download model weights from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SELECTED_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          case "$SELECTED_MODEL" in
            dynamic)
              repo="ZhengPeng7/BiRefNet_dynamic"
              folder="BiRefNet_dynamic"
              ;;
            hr)
              repo="ZhengPeng7/BiRefNet_HR"
              folder="BiRefNet_HR"
              ;;
            rmbg20)
              repo="skytnt/rmbg-2.0"
              folder="RMBG-2.0"
              ;;
            *)
              echo "Unsupported model: $SELECTED_MODEL"
              exit 1
              ;;
          esac
          mkdir -p scripts/models/$folder
          huggingface-cli download $repo model.safetensors --token "$HF_TOKEN" --local-dir scripts/models/$folder
          huggingface-cli download $repo BiRefNet_config.py --token "$HF_TOKEN" --local-dir scripts/models/$folder || true
          huggingface-cli download $repo birefnet.py --token "$HF_TOKEN" --local-dir scripts/models/$folder || true

      - name: Convert & Upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
          BUCKET: ${{ secrets.BUCKET }}
          PRODUCTS_TABLE: ${{ secrets.PRODUCTS_TABLE }}
          IMAGE_COLUMN: ${{ secrets.IMAGE_COLUMN }}
        run: |
          node scripts/convert-webp.mjs \
            --prefix "${{ inputs.prefix }}" \
            --quality "${{ inputs.quality }}" \
            --model "${{ inputs.model }}" \
            ${{ fromJSON(inputs.update_db) && '--update-db' || '' }}
